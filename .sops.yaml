# Who can decrypt what. `sops secrets/<file>` reads this to pick recipients, and
# `sops updatekeys secrets/<file>` re-encrypts an existing file after this changes.
#
# The machine recipients are their SSH *host* keys run through `ssh-to-age`, so no
# machine holds key material it did not already have, and the registry's
# sshHostKey is the source of truth:
#
#   nix run nixpkgs#ssh-to-age <<< "ssh-ed25519 AAAA..."
#
# The admin recipients are alex's ~/.ssh/id_ed25519 on each machine the fleet
# is administered from (laptop, pc, tablet), through the same conversion
# (`ssh-to-age -private-key -i ~/.ssh/id_ed25519 -o ~/.config/sops/age/keys.txt`),
# so there is no extra secret to look after: whoever holds that SSH key — which
# already opens every machine — can also read and edit these.
#
# Everything here is a public key. The encrypted files are safe to commit; the
# repo is public, so nothing irreplaceable belongs in them. A leaked host key
# would expose every secret ever encrypted to it, git history included, so
# rotate the secret as well as the key if that ever happens.
keys:
  - &admin  age1p6q3hvupt4sek6d3j45hqurut5uf8arcweutvxgf7ksyukqwedss7x37q6 # on the laptop
  - &admin_pc     age10hypj9yw78cve37yxzszq0ldeypq8veedfryxzzylaexnney8ccs3s50es
  - &admin_tablet age1jvdfnzq208fvja4dyhcdf8jj8tu6v7mrarhh39zfy8ev9z3ewetsy5rwes
  - &laptop age19hy3cr77uk3zaflnkyc9vd807wka3m5hp6aetrwvsprwg5vhlpcqe802p5
  - &tablet   age1kvrzqwd2gd99c5dvuyyyzp47s8wmz507grgke6y0qu9j9fg55gnseejzuw
  - &pc       age13hf9d5up2350sfnrv6399hcm4e969t8sfu3qhkwvlpvcqpq7nazq9e5zxy

creation_rules:
  # One machine's own secrets (modules/secrets.nix, `balaur.secrets.hostFile`):
  # that machine, and the admin keys of the machines that stay at home. Not the
  # laptop's admin key: it travels, and its disk is not encrypted, so a lost
  # laptop would otherwise give away every other machine's secrets too. Edit
  # these from the pc or the tablet.
  - path_regex: ^secrets/hosts/tablet\.yaml$
    key_groups:
      - age:
          - *admin_pc
          - *admin_tablet
          - *tablet
  - path_regex: ^secrets/hosts/pc\.yaml$
    key_groups:
      - age:
          - *admin_pc
          - *admin_tablet
          - *pc

  # Shared by the whole fleet: only what more than one machine needs. A machine
  # that must not read a secret needs its own file and its own rule above.
  - path_regex: ^secrets/balaur\.yaml$
    key_groups:
      - age:
          - *admin
          - *admin_pc
          - *admin_tablet
          - *laptop
          - *tablet
          - *pc
