<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Duet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span id="host">duet</span></div>
    <div class="clock"><time id="clock">--:--</time><span id="date"></span></div>
    <div class="pills">
      <span class="pill live" id="cam-pill" hidden></span>
      <span class="pill" id="bat-pill" hidden></span>
      <span class="pill" id="up-pill"></span>
    </div>
  </header>

  <main>
    <section class="tiles page active" id="tiles" data-page="services" aria-label="Services"></section>

    <aside class="panel page" data-page="system" aria-label="System">
      <div class="meter"><label>CPU <b id="cpu-v"></b></label><div class="bar"><i id="cpu-b"></i></div></div>
      <div class="meter"><label>Memory <b id="mem-v"></b></label><div class="bar"><i id="mem-b"></i></div></div>
      <div id="disks"></div>
      <div class="meter"><label>Temperature <b id="temp-v"></b></label><div class="bar"><i id="temp-b"></i></div></div>
      <div class="meter"><label>Load <b id="load-v"></b></label></div>

      <div class="meter" id="bright" hidden>
        <label>Screen <b id="bright-v"></b></label>
        <div class="stepper">
          <button type="button" class="btn" id="bright-dn" aria-label="Dimmer">−</button>
          <input type="range" id="bright-r" min="1" max="100" step="1" aria-label="Screen brightness">
          <button type="button" class="btn" id="bright-up" aria-label="Brighter">+</button>
        </div>
      </div>
    </aside>

    <section class="tvpage page" id="tvpage" data-page="tv" aria-label="TV" hidden>
      <div class="tv-head">
        <div><h2 id="tv-name">TV</h2><span class="tv-state" id="tv-state"></span></div>
        <button type="button" class="btn power" id="tv-power">⏻ Power</button>
      </div>
      <div class="tv-apps" id="tv-apps"></div>
      <div class="remote">
        <div class="dpad">
          <button type="button" class="btn" data-key="KEY_UP" style="grid-area:u" aria-label="Up">▲</button>
          <button type="button" class="btn" data-key="KEY_LEFT" style="grid-area:l" aria-label="Left">◀</button>
          <button type="button" class="btn ok" data-key="KEY_ENTER" style="grid-area:o">OK</button>
          <button type="button" class="btn" data-key="KEY_RIGHT" style="grid-area:r" aria-label="Right">▶</button>
          <button type="button" class="btn" data-key="KEY_DOWN" style="grid-area:d" aria-label="Down">▼</button>
        </div>
        <div class="keys">
          <button type="button" class="btn" data-key="KEY_RETURN">↩ Back</button>
          <button type="button" class="btn" data-key="KEY_HOME">⌂ Home</button>
          <button type="button" class="btn" data-key="KEY_PLAY">▶ Play</button>
          <button type="button" class="btn" data-key="KEY_PAUSE">❚❚ Pause</button>
          <button type="button" class="btn" data-key="KEY_VOLDOWN">🔉 −</button>
          <button type="button" class="btn" data-key="KEY_VOLUP">🔊 +</button>
          <button type="button" class="btn" data-key="KEY_MUTE">🔇 Mute</button>
          <button type="button" class="btn" data-key="KEY_SOURCE">⇄ Source</button>
        </div>
      </div>
      <div class="tv-msg" id="tv-msg" hidden></div>
    </section>

    <section class="aspage page" id="aspage" data-page="assistant" aria-label="Assistant" hidden>
      <div class="as-head">
        <div class="as-orb" id="as-orb" aria-hidden="true"></div>
        <div class="as-title">
          <h2 id="as-name">Assistant</h2>
          <span class="as-state" id="as-state"></span>
        </div>
        <button type="button" class="btn as-stop" id="as-stop" hidden>■ Stop</button>
        <button type="button" class="btn as-mute" id="as-mute" aria-pressed="false">🎙 Mic on</button>
      </div>
      <div class="as-err" id="as-err" hidden></div>

      <form class="as-ask" id="as-ask" autocomplete="off">
        <input type="text" id="as-input" placeholder="Type to the assistant…" aria-label="Message to the assistant" enterkeyhint="send">
        <label class="as-speak"><input type="checkbox" id="as-speak"> 🔊</label>
        <button type="submit" class="btn primary" id="as-send">Send</button>
      </form>

      <div class="as-grid">
        <div class="card as-log-card"><h3>Conversation</h3><ol class="as-log" id="as-log"></ol></div>
        <div class="as-lists" id="as-lists"></div>
        <div class="card"><h3>Timers &amp; reminders</h3><ul class="as-items" id="as-alarms"></ul></div>
        <div class="card">
          <h3>What I remember</h3>
          <ul class="as-items" id="as-mem"></ul>
          <form class="as-add" data-mem><input type="text" placeholder="Add a fact…" aria-label="Add a fact"><button type="submit" class="btn">+</button></form>
        </div>
        <div class="card">
          <h3>Speaker volume <b id="as-vol-v"></b></h3>
          <input type="range" id="as-vol" min="0" max="100" step="5" aria-label="Speaker volume">
        </div>
      </div>
    </section>

    <section class="camview page" id="camview" data-page="camera" aria-label="Camera" hidden>
      <button type="button" class="cam" id="cam" aria-label="Front camera (tap to turn off)">
        <img id="cam-v" alt="">
        <span class="cam-msg" id="cam-msg">Camera starting…</span>
        <span class="cam-tag"><i></i>Front camera · tap to switch off</span>
      </button>
    </section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Pages">
    <button type="button" class="tab active" data-tab="services"><span aria-hidden="true">▦</span>Services</button>
    <button type="button" class="tab" data-tab="system"><span aria-hidden="true">◔</span>System</button>
    <button type="button" class="tab" data-tab="tv" id="tab-tv" hidden><span aria-hidden="true">▭</span>TV</button>
    <button type="button" class="tab" data-tab="assistant" id="tab-assistant" hidden><span aria-hidden="true">◎</span>Assistant</button>
    <button type="button" class="tab" data-tab="camera" id="tab-camera" hidden><span aria-hidden="true">◉</span>Camera</button>
  </nav>

  <div class="sheet-back" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-name">
      <div class="sheet-head">
        <span class="icon" id="sheet-icon"></span>
        <div><h2 id="sheet-name"></h2><p id="sheet-desc"></p></div>
      </div>
      <dl>
        <dt>Status</dt><dd id="sheet-state"></dd>
        <dt>Address</dt><dd id="sheet-url"></dd>
        <dt>Unit</dt><dd id="sheet-unit"></dd>
      </dl>
      <div class="sheet-actions">
        <a class="btn wide primary" id="sheet-open" rel="noopener" hidden>Open</a>
        <button type="button" class="btn wide" id="sheet-close">Close</button>
      </div>
    </div>
  </div>

  <div class="as-overlay" id="as-overlay" hidden>
    <div class="as-orb big" id="as-orb-big" aria-hidden="true"></div>
    <div class="as-ov-state" id="as-ov-state"></div>
    <div class="as-ov-text" id="as-ov-text"></div>
    <button type="button" class="btn wide" id="as-ov-stop">■ Stop</button>
  </div>

  <div class="offline" id="offline" hidden>Dashboard unreachable — retrying…</div>
  <script src="app.js"></script>
</body>
</html>
