<?xml version="1.0" encoding="UTF-8"?>
<!-- Duet app icon: a house on a blue tile, in the GNOME app icon style
     (128 px grid, flat colors from the GNOME palette, a darker base edge). -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="face" x1="0" y1="12" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
  </defs>
  <!-- base edge -->
  <rect x="12" y="20" width="104" height="96" rx="20" fill="#1a5fb4"/>
  <!-- face -->
  <rect x="12" y="12" width="104" height="96" rx="20" fill="url(#face)"/>
  <!-- house shadow -->
  <path d="M64 31 L97 59 H89 V91 H39 V59 H31 Z" fill="#1c71d8" opacity="0.5" transform="translate(0 3)"/>
  <!-- house: roof and walls -->
  <path d="M64 31 L97 59 H89 V91 H39 V59 H31 Z" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <!-- chimney -->
  <rect x="78" y="36" width="8" height="15" rx="1.5" fill="#ffffff"/>
  <!-- door -->
  <path d="M57 91 V74 a7 7 0 0 1 14 0 V91 Z" fill="#3584e4"/>
  <!-- window -->
  <rect x="45" y="64" width="9" height="9" rx="1.5" fill="#99c1f1"/>
  <rect x="74" y="64" width="9" height="9" rx="1.5" fill="#99c1f1"/>
</svg>
